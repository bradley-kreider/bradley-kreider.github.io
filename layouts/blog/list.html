{{ define "main" }}
<div class="k-page not-prose">
  <div style="padding: var(--gap-4) 0 var(--gap-6);">
    <div class="k-section-head" style="padding-bottom: var(--gap-3); border-bottom: 1px solid var(--line-soft); margin-bottom: var(--gap-4);">
      <h1 style="font-size:var(--fs-sm);font-weight:600;letter-spacing:0.04em;text-transform:lowercase;color:var(--fg-muted);margin:0;">
        <span class="k-sigil" style="color:var(--accent);margin-right:8px;">##</span>blog
      </h1>
      <span style="font-size:var(--fs-xs);color:var(--fg-faint);">{{ len .Pages }} posts</span>
    </div>

    <div class="k-blog-list">
      {{ range (.Pages.GroupByDate "2006") }}
        <div class="k-blog-year">{{ .Key }}</div>
        {{ range .Pages }}
          <a class="k-blog-item" href="{{ .RelPermalink }}">
            <span class="k-date">{{ .Date.Format "Jan 02" | lower }}</span>
            <span class="k-post-title">{{ .Title | emojify }}</span>
            {{ if .ReadingTime }}<span style="font-size:var(--fs-xs);color:var(--fg-faint);white-space:nowrap;">{{ .ReadingTime }}m</span>{{ end }}
            <span class="k-arrow">→</span>
          </a>
        {{ end }}
      {{ end }}
    </div>

    {{ partial "pagination.html" . }}
  </div>
</div>
{{ end }}
