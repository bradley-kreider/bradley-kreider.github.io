{{ define "main" }}
<div class="k-page not-prose">
  <div style="padding: var(--gap-4) 0 var(--gap-6);">
    <h1 style="font-size:clamp(28px,5vw,52px);font-weight:600;letter-spacing:-0.025em;line-height:1.1;color:var(--fg);margin-bottom:var(--gap-4);">
      {{ .Title | emojify }}
    </h1>
    <div class="k-about">
      <div class="prose dark:prose-invert" style="color:var(--fg);max-width:72ch;">
        {{ .Content }}
      </div>
      <div>
        <img
          src="/img/about.jpg"
          alt="Brad Kreider"
          class="k-about-photo"
          loading="lazy">
      </div>
    </div>
  </div>
</div>
{{ end }}
