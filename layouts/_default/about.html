{{ define "main" }}
<div class="k-page not-prose">
  <div class="k-prose-page" style="padding-left:0;padding-right:0;">
    <article>
      <h1>{{ .Title | emojify }}</h1>
      <div class="k-about">
        <div class="k-about-content prose dark:prose-invert">
          {{ .Content }}
        </div>
        <div>
          <img
            src="/img/about.jpg"
            alt="Brad Kreider"
            class="k-about-photo"
            loading="lazy">
        </div>
      </div>

      <section class="k-career not-prose">
        <h2 class="k-career-title">Work Experience</h2>
        {{ partial "timeline.html" . }}
        <div class="k-career-actions">
          <a href="/uploads/resume.pdf" target="_blank" rel="noopener noreferrer" class="k-career-cv">Download Resume →</a>
        </div>
      </section>
    </article>
  </div>
</div>
{{ end }}
